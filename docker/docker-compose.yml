# Yeni sistem: uygulama + PostgreSQL 17.
#   docker compose -f docker/docker-compose.yml up --build
# Uygulama: http://localhost:8080   Sağlık: http://localhost:8080/api/v1/health
# Not: Moodle (eski sistem) ayrı çalışır, bkz. ortam/README.md (http://localhost:8000).
services:
  modern-db:
    image: postgres:17
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: "${MODERN_DB_PASSWORD:-local_dev_only}"
      POSTGRES_DB: moodle_modern
    volumes:
      - modern-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle -d moodle_modern"]
      interval: 5s
      timeout: 5s
      retries: 20

  clamav:
    image: clamav/clamav:stable
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s

  modern:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      modern-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Development__UseFakeIdentity: "false"
      ClamAv__Host: "clamav"
      AsgApi__BaseUrl: "http://localhost:8080"
      Database__Initialize: "true"
      SEED_SAMPLE_DATA: "${SEED_SAMPLE_DATA:-false}"   # true: ortam/ornek-veri.feature verisini yükler (ISeedContributor'lar)
      Database__SeedAsg: "${ASG_SEED:-false}"
      FILES_ROOT: /var/moodle-files   # içerik adresli dosya deposu (modern-files birimi)
      DataProtection__KeysPath: /var/moodle-keys   # oturum çerezi anahtarları (modern-dp-keys birimi; AUTH-NFR-03 aday)
      ConnectionStrings__Default: "Host=modern-db;Port=5432;Database=moodle_modern;Username=moodle;Password=${MODERN_DB_PASSWORD:-local_dev_only}"
      # Opsiyonel: /admin/files gibi SiteAdmin'e özel uçları yerelde denemek için (bkz. ConfiguredSiteAdminSeedContributor).
      # ornek-veri.feature'daki yonetici1 yalnızca Manager'dır, SiteAdmin değildir — bu, o veriye ek bir kullanıcıdır.
      # Yalnızca ikisi birden ve SEED_SAMPLE_DATA=true iken devreye girer; Development/Testing dışında reddedilir.
      Development__SiteAdmin__Username: "${SITEADMIN_USERNAME:-}"
      Development__SiteAdmin__Password: "${SITEADMIN_PASSWORD:-}"
    volumes:
      - modern-files:/var/moodle-files
      - modern-dp-keys:/var/moodle-keys
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  modern-db-data:
  modern-files:
  modern-dp-keys:
  clamav-data:
